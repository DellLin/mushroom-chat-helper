name: Release

# 推一個 vX.Y.Z 的 tag 就會建置並發佈 Release。
# 例:git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新發佈的 tag(例:v0.1.0),該 tag 必須已經存在'
        required: true
        type: string

permissions:
  contents: write   # 建立 Release / 上傳檔案需要

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            Write-Error "tag 格式不對: $tag (需要 vX.Y.Z)"
            exit 1
          }
          "tag=$tag"                     >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0   # --generate-notes 需要完整歷史

      # tag 與 Cargo.toml 版本不一致通常代表忘了改版號,先擋下來比較好。
      - name: Verify Cargo.toml version matches tag
        shell: pwsh
        run: |
          # 用 cargo metadata 取版號,不要用正規表示式掃 Cargo.toml ——
          # [dependencies.windows] 底下也有一行 version =,會抓錯。
          $cargoVersion = (cargo metadata --no-deps --format-version 1 |
            ConvertFrom-Json).packages[0].version
          $tagVersion = '${{ steps.tag.outputs.version }}'
          Write-Host "Cargo.toml = $cargoVersion / tag = $tagVersion"
          if ($cargoVersion -ne $tagVersion) {
            Write-Error "版本不一致:Cargo.toml 是 $cargoVersion,tag 是 $tagVersion。請先更新 Cargo.toml 再重打 tag。"
            exit 1
          }

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package
        id: package
        shell: pwsh
        run: |
          $tag  = '${{ steps.tag.outputs.tag }}'
          $name = "mushroom-chat-helper-$tag-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/mushroom-chat-helper.exe "dist/$name/"
          Copy-Item README.md, LICENSE                      "dist/$name/"
          # 壓資料夾本身(不是 /*),解開來才會是一個乾淨的資料夾
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

          # 讓使用者可以驗證下載的檔案沒有被動過
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
          Write-Host "SHA256: $hash"
          "zip=dist/$name.zip" >> $env:GITHUB_OUTPUT

          # 裸的 exe 與它的校驗檔。程式內建的自動更新抓的就是這兩個附件
          # (檔名必須跟 src/update/github.rs 的 EXE_ASSET 一致):名字固定
          # 不帶版號,更新流程才不用自己拼字串猜檔名,也省下在程式裡塞一個
          # zip 解碼器。順帶讓只想要一顆 exe 的使用者不必先解壓縮。
          $exe = 'mushroom-chat-helper.exe'
          Copy-Item "target/release/$exe" "dist/$exe"
          $exeHash = (Get-FileHash "dist/$exe" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  $exe" | Out-File -Encoding ascii "dist/$exe.sha256"
          Write-Host "exe SHA256: $exeHash"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          # 已存在就只更新附件,方便重跑 workflow_dispatch
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'
          # PowerShell 不會幫原生執行檔展開萬用字元,gh 會收到字面上的
          # "dist/*.zip" 而找不到檔案 —— 這裡先自己展開再用陣列展開傳進去。
          $assets = @(Get-ChildItem -Path dist/*.zip, dist/*.exe, dist/*.sha256 |
            ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { Write-Error "找不到要上傳的檔案"; exit 1 }
          Write-Host "上傳:$($assets -join ', ')"

          # 少了裸 exe 的話,舊版程式的「自動更新」會查到新版卻下載不到東西,
          # 只能請使用者手動下載。與其讓它悄悄退化,不如在這裡就擋下來。
          $exeAsset = 'mushroom-chat-helper.exe'
          foreach ($required in @($exeAsset, "$exeAsset.sha256")) {
            if (-not ($assets | Where-Object { (Split-Path $_ -Leaf) -eq $required })) {
              Write-Error "自動更新需要的附件不見了:$required"
              exit 1
            }
          }

          if ($exists) {
            Write-Host "Release $tag 已存在,覆寫附件"
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "$tag" --generate-notes --verify-tag
          }
