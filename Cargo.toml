[package]
name = "maple-chat-filter"
version = "0.1.0"
edition = "2021"
description = "新楓之谷聊天篩選工具:畫面擷取 + 依文字顏色分類頻道,直接顯示對話截圖"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossbeam-channel = "0.5"
eframe = "0.29"
egui = "0.29"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dependencies.windows]
version = "=0.58.0"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
