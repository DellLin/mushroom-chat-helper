[package]
name = "mushroom-chat-helper"
version = "0.3.0"
edition = "2021"
description = "蘑菇聊天小幫手:新楓之谷畫面擷取 + 依文字顏色分類頻道,直接顯示對話截圖"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossbeam-channel = "0.5"
# 算繪後端固定用 glow(OpenGL),不要換成 wgpu:wgpu 在 Windows 上會挑 Vulkan,
# NVIDIA App / GOG Galaxy 這類疊圖軟體就會把本程式當成遊戲勾住,把 FPS/溫度 OSD
# 畫到聊天視窗上 —— 本程式自己就是要疊在遊戲上的疊圖層,被別人疊回來等於毀掉用途。
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui = "0.36"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "1"
# 自動更新用:查 GitHub Releases、下載新版執行檔、核對 SHA256(見 src/update)。
ureq = "3.4.0"
serde_json = "1.0.151"
sha2 = "0.11.0"

[dependencies.windows]
version = "=0.62.2"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]

[build-dependencies]
# 把 assets/icon.ico 嵌成 exe 的圖示資源(檔案總管/捷徑看到的那個)。
winresource = "0.1"
# 建置期把 icon-256.png 解成 RGBA,執行期就不用背一個 PNG 解碼器。
png = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
